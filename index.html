<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>★ 51单片机学园 ☆ - 零基础也能学会！</title>
<style>
/* ========== 简约风 ========== */
:root{
  --accent:#2563eb;
  --accent-dark:#1d4ed8;
  --ink:#1f2937;
  --ink-light:#6b7280;
  --line:#e5e7eb;
  --bg:#ffffff;
  --bg-soft:#f9fafb;
  --ok:#059669;
  --err:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.75;overflow-x:hidden;font-size:15px;-webkit-font-smoothing:antialiased}
body::before{display:none}
.app{position:relative;min-height:100%;padding-bottom:80px}

/* ========== 顶部导航 ========== */
header{
  background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;backdrop-filter:saturate(180%) blur(8px);
}
.header-inner{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 20px}
.logo{font-size:18px;font-weight:600;color:var(--ink);letter-spacing:.5px}
.logo .chip{display:inline-block;background:#f3f4f6;border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:12px;color:var(--ink-light);margin-left:6px;font-weight:500}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{
  background:transparent;border:none;color:var(--ink-light);
  padding:8px 14px;border-radius:6px;font-weight:500;cursor:pointer;
  font-size:14px;transition:color .15s,background .15s;
}
nav button:hover{color:var(--ink);background:#f3f4f6}
nav button.active{color:var(--accent);background:#eff6ff}

/* ========== 主容器 ========== */
main{max-width:880px;margin:28px auto;padding:0 20px}
.page{display:none;animation:fade .25s ease-out}
.page.active{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ========== 卡片 ========== */
.card{
  background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:24px;margin-bottom:20px;
}
.card.pink,.card.lemon,.card.mint,.card.lilac{background:#fff}
.card h2{font-size:20px;margin-bottom:14px;font-weight:600;color:var(--ink)}
.card h3{font-size:16px;margin:20px 0 10px;font-weight:600;color:var(--ink)}
.card h4{font-size:14px;margin:14px 0 6px;font-weight:600;color:var(--ink)}
.card p,.card li{font-size:15px}
.card ul,.card ol{padding-left:22px;margin:8px 0}
.card li{margin:4px 0}

/* ========== 首页 ========== */
.hero{
  border:1px solid var(--line);border-radius:8px;padding:40px 24px;text-align:center;
  margin-bottom:28px;background:#fff;
}
.hero h1{font-size:26px;color:var(--ink);margin-bottom:10px;font-weight:700;letter-spacing:.5px}
.hero p{font-size:15px;color:var(--ink-light)}
.mascot{display:none}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;margin-bottom:24px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:#fff;padding:18px 12px;text-align:center}
.stat .num{font-size:26px;font-weight:700;color:var(--accent);line-height:1.2}
.stat .label{font-size:12px;color:var(--ink-light);margin-top:4px}

.chapter-list{display:grid;gap:10px}
.chapter-item{
  display:flex;align-items:center;gap:14px;
  background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s;
}
.chapter-item:hover{border-color:var(--accent);background:#fafbfc}
.chapter-item.done{border-color:#d1fae5;background:#f0fdf4}
.chapter-item .num{
  flex-shrink:0;width:36px;height:36px;border-radius:6px;
  background:#f3f4f6;color:var(--ink-light);display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:15px;border:1px solid var(--line);
}
.chapter-item.done .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.chapter-item .info{flex:1;min-width:0}
.chapter-item .title{font-weight:600;font-size:15px}
.chapter-item .desc{font-size:13px;color:var(--ink-light);margin-top:2px}
.chapter-item .badge{flex-shrink:0;font-size:12px;color:var(--ink-light)}
.chapter-item.done .badge{color:var(--ok)}
.progress-bar{width:100%;height:4px;background:#f3f4f6;border-radius:2px;margin-top:8px;overflow:hidden}
.progress-bar > div{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}

/* ========== 课程详情 ========== */
.chapter-nav{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.chapter-nav button{
  background:#fff;border:1px solid var(--line);border-radius:6px;
  padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink);
  transition:all .15s;font-weight:500;
}
.chapter-nav button:hover{border-color:var(--accent);color:var(--accent)}
.chapter-nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}

.content img{max-width:100%;border-radius:6px;margin:10px 0;border:1px solid var(--line)}
.content .tip{background:#f0f9ff;border-left:3px solid var(--accent);border-radius:4px;padding:12px 14px;margin:14px 0;font-size:14px}
.content .tip::before{content:"";margin:0}
.content .warn{background:#fef2f2;border-left:3px solid var(--err);border-radius:4px;padding:12px 14px;margin:14px 0;font-size:14px}
.content .warn::before{content:"";margin:0}
.content code{background:#f3f4f6;border-radius:3px;padding:1px 6px;color:var(--ink);font-family:"SF Mono",Consolas,"Courier New",monospace;font-size:.9em;border:1px solid var(--line)}
.content pre{
  background:#111827;color:#e5e7eb;border-radius:8px;padding:14px 16px;
  overflow-x:auto;font-family:"SF Mono",Consolas,"Courier New",monospace;font-size:13px;
  border:none;margin:12px 0;line-height:1.65;
}
.content pre .kw{color:#c084fc}
.content pre .str{color:#fbbf24}
.content pre .cm{color:#9ca3af;font-style:italic}
.content pre .fn{color:#34d399}

.fav-btn{float:right;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--ink-light);transition:all .15s}
.fav-btn:hover{border-color:var(--accent);color:var(--accent)}
.fav-btn.faved{background:var(--accent);border-color:var(--accent);color:#fff}

/* ========== 测验 ========== */
.quiz-block{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.quiz-block h3{font-size:16px;margin-bottom:16px;color:var(--ink)}
.q-item{
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;
  margin-bottom:14px;
}
.q-item .q-num{display:inline-block;background:var(--ink);color:#fff;border-radius:3px;padding:1px 8px;font-size:12px;margin-right:8px;font-weight:500}
.q-item .q-text{font-weight:600;margin-bottom:10px;color:var(--ink)}
.q-item .q-type{font-size:11px;background:#f3f4f6;color:var(--ink-light);padding:2px 7px;border-radius:3px;margin-left:8px;font-weight:400;border:1px solid var(--line)}
.q-item .opt{display:block;margin:6px 0;padding:9px 14px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff;transition:all .12s;font-size:14px}
.q-item .opt:hover{background:#f9fafb;border-color:var(--accent)}
.q-item .opt.selected{background:#eff6ff;border-color:var(--accent)}
.q-item .opt.correct{background:#f0fdf4;border-color:#bbf7d0;color:var(--ok)}
.q-item .opt.wrong{background:#fef2f2;border-color:#fecaca;color:var(--err)}
.q-item input[type=text]{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:6px;
  font-size:14px;font-family:"SF Mono",Consolas,monospace;
  transition:border-color .15s;
}
.q-item input[type=text]:focus{outline:none;border-color:var(--accent)}
.q-item input[type=text].correct{background:#f0fdf4;border-color:var(--ok);color:var(--ok)}
.q-item input[type=text].wrong{background:#fef2f2;border-color:var(--err);color:var(--err)}
.q-item .ans-hint{font-size:12px;color:var(--ink-light);margin-top:6px}
.q-feedback{margin-top:10px;font-weight:500;font-size:14px}
.q-feedback.ok{color:var(--ok)}
.q-feedback.no{color:var(--err)}

.quiz-controls{text-align:center;margin-top:20px}
.btn-primary{
  background:var(--accent);
  color:#fff;border:none;border-radius:6px;padding:11px 28px;font-size:14px;font-weight:500;
  cursor:pointer;transition:background .15s;letter-spacing:.5px;
}
.btn-primary:hover{background:var(--accent-dark)}
.btn-primary:active{background:#1e40af}
.btn-secondary{
  background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 22px;font-size:14px;font-weight:500;cursor:pointer;margin:0 4px;transition:all .15s;
}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}

.score-box{text-align:center;padding:20px;background:#f9fafb;border:1px solid var(--line);border-radius:8px;margin:14px 0}
.score-box .big{font-size:44px;font-weight:700;color:var(--accent);line-height:1}
.score-box .label{font-size:13px;color:var(--ink-light);margin-top:4px}
.score-box .msg{font-size:15px;margin-top:8px;color:var(--ink)}

/* ========== 个人中心 ========== */
.center-tabs{display:flex;gap:0;margin-bottom:18px;border-bottom:1px solid var(--line)}
.center-tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:12px;font-weight:500;cursor:pointer;font-size:14px;color:var(--ink-light);transition:all .15s}
.center-tabs button:hover{color:var(--ink)}
.center-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.empty{text-align:center;padding:48px 20px;color:var(--ink-light);font-size:14px}
.empty .emoji{display:none}

.wrong-item,.fav-item{
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 16px;
  margin-bottom:10px;
}
.wrong-item .q,.fav-item .title{font-weight:600;color:var(--ink)}
.wrong-item .meta,.fav-item .meta{font-size:12px;color:var(--ink-light);margin-top:4px}
.wrong-item .del,.fav-item .del{
  float:right;background:none;border:1px solid var(--err);color:var(--err);
  border-radius:4px;padding:2px 10px;cursor:pointer;font-size:12px;font-weight:500;
  transition:all .15s;
}
.wrong-item .del:hover,.fav-item .del:hover{background:var(--err);color:#fff}
.wrong-item .ans{margin-top:8px;font-size:13px;background:#f0fdf4;border-radius:4px;padding:6px 10px;color:var(--ok)}

/* ========== 响应式 ========== */
@media(max-width:640px){
  header{padding:0}
  .header-inner{padding:12px 16px}
  main{padding:0 14px;margin-top:18px}
  .hero{padding:28px 18px}
  .hero h1{font-size:20px}
  .card{padding:16px}
  .chapter-item{padding:12px}
  .chapter-item .num{width:32px;height:32px;font-size:14px}
  .btn-primary{padding:10px 22px;font-size:14px}
  .score-box .big{font-size:36px}
  main{max-width:100%}
  .header-inner{max-width:100%}
}

.heart{display:none}
@keyframes celebrate{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.celebrate{animation:celebrate .6s ease-in-out}
</style>
</head>

<script>
const CHAPTERS = [
{
  id:1, title:"什么是单片机 & 标号信息", short:"单片机是什么？芯片上印的数字啥意思？",
  emoji:"🌸", color:"pink",
  content:`
<h3>🤔 什么是单片机？</h3>
<p>用专业语言讲，<b>单片机</b>就是在一块硅片上集成了<b>微处理器、存储器、各种输入/输出接口</b>的芯片，这样一块芯片就具有了计算机的属性，因而被称为<b>单片微型计算机</b>，简称单片机。</p>

<div class="tip">通俗来说：单片机就是一台超小型的"电脑"，能干活、能控制，广泛用在各种电子设备里。</div>

<h3>🏷️ 芯片标号怎么读？</h3>
<p>示例标号：<code>STC 89C51RC 40C-PDIP 0707CU8138.00D</code></p>
<ul>
  <li><b>STC</b> — 前缀，表示 STC 公司生产（其他厂商还有 AT、Intel、Winbond、SST 等）</li>
  <li><b>89C51</b> — 8051 兼容系列；其中 89 通常表示 Flash 程序存储器，C 表示 CMOS 器件</li>
  <li><b>RC</b> — 片内 RAM 512B（同系列 RD+ 为 1280B）</li>
  <li><b>40</b> — 通常与速度等级有关</li>
  <li><b>C</b> — 商业级温度范围 0℃～+75℃（I 工业级 -40℃～+85℃）</li>
  <li><b>PDIP</b> — 双列直插式封装（DIP）</li>
</ul>

<h3>📦 常见封装类型（实物图解）</h3>

<p>三种常见封装对比（左：DIP 双列直插；中：QFP 四边扁平；右：PLCC 方形）：</p>
<img src="https://k1.spdns.de/Develop/Hardware/Infomix/IC%20Geh%C3%A4useformen/DIP%2CPQFP%2CPLCC.png" alt="DIP QFP PLCC 封装对比" referrerpolicy="no-referrer" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div style=&quot;background:#f3f4f6;padding:10px;border-radius:6px;font-size:13px;color:#6b7280;text-align:center&quot;>📷（封装对比图加载中）</div>')">

<p>PLCC 封装实物（方形，J 形内弯引脚，适合 SMT 贴装）：</p>
<img src="https://k1.spdns.de/Develop/Hardware/Infomix/IC%20Geh%C3%A4useformen/PLCC.jpg" alt="PLCC 封装实物" referrerpolicy="no-referrer" onerror="this.style.display='none'">

<p>QFP 封装实物（四边鸥翼式外弯引脚）：</p>
<img src="https://k1.spdns.de/Develop/Hardware/Infomix/IC%20Geh%C3%A4useformen/PQFP-44.jpg" alt="PQFP-44 封装实物" referrerpolicy="no-referrer" onerror="this.style.display='none'">

<ol>
  <li><b>DIP</b>（双列直插式）：引脚从芯片两侧引出，适合手工焊接，能看到引脚是"直着"伸出来的</li>
  <li><b>PLCC</b>（带引线塑料封装）：方形，J 形内弯引脚勾住 PCB 焊盘</li>
  <li><b>QFP</b>（四边引脚扁平式）：表面贴装（SMT），引脚向外弯成"鸥翼"状</li>
  <li><b>BGA</b>（球栅阵列）：高密度多引脚，引脚变成锡球在芯片底部</li>
</ol>

<h3>🌍 单片机能做什么？</h3>
<ul>
  <li>🏭 工业自动化：数据采集、测控</li>
  <li>📟 智能仪器：示波器、万用表、信号源</li>
  <li>🏠 消费电子：洗衣机、空调、电视、微波炉、汽车电子</li>
  <li>📡 通信：调制解调器、程控交换</li>
  <li>🚀 武器装备：飞机、军舰、导弹制导</li>
</ul>
  `,
  quiz:[
    {type:"single", text:"单片机集成了哪些基本模块？", opts:["仅微处理器","微处理器、存储器、输入/输出接口","仅存储器","仅输入/输出接口"], ans:1},
    {type:"single", text:"标号 STC89C51 中的 '89' 通常表示？", opts:["8KB 存储器","采用 Flash 程序存储器","8MHz 频率","8 位处理器"], ans:1},
    {type:"fill", text:"DIP 封装的全称是______。", ans:"双列直插式封装", hint:"四个字开头"},
    {type:"judge", text:"AT89C51 中的 'C' 表示陶瓷封装。", ans:false, reason:"'C' 表示 CMOS 器件，不是陶瓷封装。"},
  ]
},
{
  id:2, title:"51 单片机外部引脚介绍", short:"40 个脚各有什么用？电源、时钟、复位、IO",
  emoji:"🔌", color:"sky",
  content:`
<h3>🧷 40 脚 DIP 封装引脚图</h3>
<p>下图清晰标注了 40 引脚 DIP 封装的 8051 每一脚的功能：</p>
<img src="pinout_8051.gif" alt="8051 40 脚引脚图" onerror="this.style.display='none'">

<p>芯片上有一个<b>小圆点或凹口</b>，正对着左上角时，<b>从左上角那个脚开始，逆时针数</b>就是 1、2、3…… 脚。最后一个（40脚）在 1 脚的正对面。</p>

<h3>⚡ 电源和时钟引脚（必掌握）</h3>
<ul>
  <li><b>Vcc（40脚）</b> — 电源正极，通常 +5V</li>
  <li><b>GND（20脚）</b> — 电源地</li>

<p>C 语言：<code>&</code> 按位与；<code>&&</code> 逻辑与</p>
<pre><span class="cm">// 按位与：逐位运算</span>

<h3>🔗 或运算（OR）</h3>

<p>C 语言：<code>|</code> 按位或；<code>||</code> 逻辑或</p>

<h3>🏠 main() 函数</h3>
<p>每个 C 程序都必须有一个 <code>main()</code> 函数，程序从这里开始执行。</p>
<pre><span class="kw">void</span> <span class="fn">main</span>(<span class="kw">void</span>){
    <span class="cm">// 初始化代码写在这里</span>
    
    <span class="kw">while</span>(<span class="str">1</span>){
        <span class="cm">// 主循环里放你的功能</span>
    }
}</pre>

<div class="tip">单片机程序通常用 <code>while(1){}</code> 做无限循环，因为 main 执行完后不能像 PC 程序那样"退出"，必须一直循环检测和响应。</div>

<h3>🔄 while 语句</h3>
<p>格式：<code>while(表达式) { 语句 }</code></p>
<ul>
  <li><b>先判断表达式</b>，非 0（真）就执行循环体，为 0（假）就跳出</li>
  <li>表达式可以是常量、运算、函数返回值</li>
  <li>循环体可以为空：<code>while(1);</code></li>
</ul>

<h3>🔁 for 语句</h3>
<p>格式：<code>for(表达式1; 表达式2; 表达式3) { 语句 }</code></p>
<p>执行过程：①执行表达式1 → ②判断表达式2，真则执行循环体 → ③执行表达式3 → 回到②</p>

<pre><span class="kw">unsigned char</span> i;
<span class="kw">for</span>(i=<span class="str">0</span>; i&lt;<span class="str">10</span>; i++){
    P1 = i;   <span class="cm">// P1 口依次输出 0~9</span>
}</pre>

<pre><span class="cm">// 简单的空循环延时（不精确！）</span>

}</pre>

<p>下图是一块 51 单片机开发板的完整原理图，能看到晶振、电容、复位、地址锁存器、SRAM、串口 MAX232 等元件：</p>

<img src="https://www.pjrc.com/tech/8051/board2/board-big.jpg" alt="51 单片机开发板实物" referrerpolicy="no-referrer" onerror="this.style.display='none'">

<h3>⚡ 电源电路</h3>
<p>Vcc 接 +5V，GND 接地。通常在 Vcc 和 GND 之间就近接一个 <b>0.1μF 电容</b>去耦，滤除高频噪声。</p>

<h3>🕐 时钟电路</h3>

}</pre>

<h3>🧠 定时器是什么？</h3>
<p>单片机内部有"计数器"硬件，每来一个脉冲就 +1，加到溢出时触发中断。51 通常有两个定时器：<b>T0</b> 和 <b>T1</b>（52 还有 T2）。</p>
<ul>
  <li><b>定时模式</b>：内部时钟脉冲计数（机器周期的 1/12，12MHz 晶振时是 1μs 一次）</li>
  <li><b>计数模式</b>：从 T0/T1 引脚输入外部脉冲计数</li>
</ul>

<h3>📋 相关特殊功能寄存器</h3>
<ul>
  <li><b>TMOD</b>（工作方式寄存器）：设置 T0/T1 的工作模式</li>
  <li><b>TCON</b>（控制寄存器）：启动/停止、溢出标志位</li>
  <li><b>TH0 / TL0</b>：T0 的计数初值（高 8 位 / 低 8 位）</li>
</ul>

<h3>⚙️ 四种工作方式</h3>
<ul>
  <li><b>方式 0</b>：13 位定时器（基本不用）</li>
  <li><b>方式 1</b>：<b>16 位定时器</b>（最常用！范围 0~65535）</li>
  <li><b>方式 2</b>：<b>8 位自动重装</b>（常用于串口波特率发生器）</li>
  <li><b>方式 3</b>：T0 分成两个 8 位</li>
</ul>

<h3>🧮 初值计算（方式 1）</h3>
<p>16 位定时器从初值 X 计到溢出需要 <b>(65536 - X)</b> 个机器周期。</p>
<p>定时时间 t = (65536 - X) × 机器周期</p>
<p>12MHz 晶振时机器周期 = 1μs，定时 10ms：</p>
<p>65536 - X = 10000 → X = 55536 = 0xD8F0 → <b>TH0=0xD8, TL0=0xF0</b></p>

<h3>💡 示例：定时器 0 方式 1 定时 10ms</h3>
<pre><span class="kw">void</span> <span class="fn">Timer0_Init</span>(<span class="kw">void</span>){
    TMOD &amp;= <span class="str">0xF0</span>;      <span class="cm">// 清 T0 的方式位</span>
    TMOD |= <span class="str">0x01</span>;       <span class="cm">// T0 方式 1（16位）</span>
    TH0 = <span class="str">0xD8</span>;         <span class="cm">// 初值高 8 位</span>
    TL0 = <span class="str">0xF0</span>;         <span class="cm">// 初值低 8 位</span>
    TR0 = <span class="str">1</span>;           <span class="cm">// 启动 T0</span>
}

<span class="cm">// 在主循环中检测溢出标志</span>
<span class="kw">if</span>(TF0){
    TF0 = <span class="str">0</span>;           <span class="cm">// 清溢出标志</span>
    TH0 = <span class="str">0xD8</span>;       <span class="cm">// 重装初值</span>
    TL0 = <span class="str">0xF0</span>;
    <span class="cm">// 10ms 到了，写你的功能</span>
}</pre>

<div class="tip">方式 2（自动重装）只需设置 TH0 为重装值，TL0 为初始值，溢出后硬件自动重装，不用软件手动写回。</div>

<h3>🎛️ 中断允许寄存器 IE</h3>

<h3>🖊️ 中断服务函数写法</h3>
<pre><span class="kw">#include</span> <span class="str">&lt;reg52.h&gt;</span>

<span class="kw">void</span> <span class="fn">Timer0_Init</span>(<span class="kw">void</span>){
    TMOD |= <span class="str">0x01</span>;       <span class="cm">// T0 方式 1</span>

<h3>💬 串口通信是什么？</h3>
<p>就是单片机和电脑（或另一个单片机）之间<b>一根线发数据、一根线收数据</b>的通信方式。常用格式：<b>8N1</b>（8位数据、无校验、1位停止位）。</p>

<h3>🔌 引脚</h3>
<ul>
  <li><b>P3.0 (RXD)</b> — 接收数据</li>
  <li><b>P3.1 (TXD)</b> — 发送数据</li>
</ul>

<h3>📋 相关寄存器</h3>
<ul>
  <li><b>SCON</b> — 串口控制寄存器（设置工作方式、发送/接收标志）</li>
  <li><b>TMOD</b> — 其中 T1 需设置为方式 2（8位自动重装）做波特率发生器</li>
  <li><b>TH1 / TL1</b> — T1 重装值，决定波特率</li>
  <li><b>SBUF</b> — 发送/接收缓冲寄存器</li>
</ul>

<h3>📐 波特率设置（常用 9600）</h3>
<p>11.0592MHz 晶振 + T1 方式 2 产生 9600 波特率：<b>TH1 = TL1 = 0xFD</b></p>

<h3>💡 示例：串口初始化 + 发送 + 接收中断</h3>
<pre><span class="kw">#include</span> <span class="str">&lt;reg52.h&gt;</span>

<span class="kw">void</span> <span class="fn">UART_Init</span>(<span class="kw">void</span>){
    TMOD &amp;= <span class="str">0x0F</span>;
    TMOD |= <span class="str">0x20</span>;       <span class="cm">// T1 方式 2</span>
    TH1 = <span class="str">0xFD</span>; TL1 = <span class="str">0xFD</span>; <span class="cm">// 9600 @ 11.0592MHz</span>
    TR1 = <span class="str">1</span>;           <span class="cm">// 启动 T1</span>
    
    SCON = <span class="str">0x50</span>;       <span class="cm">// 方式 1，允许接收 REN=1</span>
    EA = <span class="str">1</span>; ES = <span class="str">1</span>;  <span class="cm">// 开总中断、开串口中断</span>
}

<span class="kw">void</span> <span class="fn">UART_SendByte</span>(<span class="kw">unsigned char</span> b){
    SBUF = b;
    <span class="kw">while</span>(TI == <span class="str">0</span>);   <span class="cm">// 等发送完成</span>
    TI = <span class="str">0</span>;           <span class="cm">// 清中断标志</span>
}

<span class="cm">// 串口接收中断服务函数（中断号 4）</span>
<span class="kw">void</span> <span class="fn">UART_ISR</span>(<span class="kw">void</span>) <span class="kw">interrupt</span> <span class="str">4</span> {
    <span class="kw">if</span>(RI){           <span class="cm">// 接收中断</span>
        RI = <span class="str">0</span>;       <span class="cm">// 先清标志！</span>
        <span class="kw">unsigned char</span> recv = SBUF;  <span class="cm">// 读走数据</span>
        UART_SendByte(recv);  <span class="cm">// 原样回显</span>
    }
}</pre>

<!-- ============ 应用逻辑 ============ -->
<script>
/* ========== 存储管理 ========== */
const Store = {
  get(key, def){ try{ const v = localStorage.getItem(key); return v===null?def:JSON.parse(v); }catch(e){ return def; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} },
  get progress(){ return this.get('progress', {}); },
  set progress(v){ this.set('progress', v); },
  get favorites(){ return this.get('favorites', []); },
  set favorites(v){ this.set('favorites', v); },
  get wrongs(){ return this.get('wrongs', []); },
  set wrongs(v){ this.set('wrongs', v); },
  get scoreHistory(){ return this.get('scoreHistory', []); },
  set scoreHistory(v){ this.set('scoreHistory', v); },
  isDone(id){ return !!this.progress[id]; },
  markDone(id, score){
    const p = this.progress;
    const old = p[id];
    p[id] = { done:true, score: Math.max(score||0, old?.score||0), time: Date.now() };
    this.progress = p;
    const h = this.scoreHistory;
    h.push({ id, score, time: Date.now() });
    if(h.length > 50) h.shift();
    this.scoreHistory = h;
  },
  toggleFav(id){
    const f = this.favorites;
    const i = f.indexOf(id);
    if(i>=0) f.splice(i,1); else f.push(id);
    this.favorites = f;
    return i<0;
  },
  isFav(id){ return this.favorites.includes(id); },
  addWrong(qid, data){
    const w = this.wrongs;
    const i = w.findIndex(x => x.qid===qid);
    const entry = { qid, ...data, time: Date.now() };
    if(i>=0) w[i] = entry; else w.push(entry);
    this.wrongs = w;
  },
  removeWrong(qid){
    this.wrongs = this.wrongs.filter(x => x.qid !== qid);
  },
};

/* ========== 路由 ========== */
let currentPage = 'home';
let currentChapter = null;
function showPage(name){
  currentPage = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.nav===name));
  window.scrollTo({top:0, behavior:'smooth'});
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  const name = b.dataset.nav;
  showPage(name);
  if(name==='home') renderHome();
  if(name==='center') renderCenter('progress');
}));

/* ========== 首页渲染 ========== */
function renderHome(){
  const list = document.getElementById('chapter-list-home');
  list.innerHTML = CHAPTERS.map(ch => `
    <div class="chapter-item ${Store.isDone(ch.id)?'done':''}" data-id="${ch.id}">
      <div class="num">${ch.emoji}</div>
      <div class="info">
        <div class="title">第 ${ch.id} 章 ${ch.title}</div>
        <div class="desc">${ch.short}</div>
        <div class="progress-bar"><div style="width:${Store.isDone(ch.id)?'100%':'0%'}"></div></div>
      </div>
      <div class="badge">${Store.isDone(ch.id)?'✅ 已学':'📖 去学习'}</div>
    </div>
  `).join('');
  list.querySelectorAll('.chapter-item').forEach(el => el.addEventListener('click', () => {
    openChapter(parseInt(el.dataset.id));
  }));
  // 统计
  const p = Store.progress;
  const doneCount = Object.values(p).filter(x => x.done).length;
  document.getElementById('stat-done').textContent = doneCount;
  const last = Store.scoreHistory.slice().reverse().find(s => true);
  document.getElementById('stat-score').textContent = last ? last.score + '分' : '-';
  document.getElementById('stat-wrong').textContent = Store.wrongs.length;
  document.getElementById('stat-fav').textContent = Store.favorites.length;
}

/* ========== 打开章节 ========== */
function openChapter(id){
  currentChapter = id;
  const ch = CHAPTERS.find(c => c.id === id);
  showPage('course');
  renderChapterNav();
  document.getElementById('fav-btn').textContent = Store.isFav(id) ? '★ 已收藏' : '⭐ 收藏';
  document.getElementById('fav-btn').classList.toggle('faved', Store.isFav(id));
  document.getElementById('chapter-content').innerHTML = `<div style="font-size:48px;text-align:center;margin:10px 0">${ch.emoji}</div><h2 style="text-align:center;color:var(--pink-deep)">第 ${ch.id} 章 ${ch.title}</h2><p style="text-align:center;color:var(--ink-light);margin-bottom:14px">${ch.short}</p>${ch.content}`;
  renderQuiz(ch, false);
  document.getElementById('score-result').innerHTML = '';
  document.getElementById('quiz-controls').style.display = 'block';
}

function renderChapterNav(){
  const nav = document.getElementById('chapter-nav');
  nav.innerHTML = CHAPTERS.map(c => `<button class="${c.id===currentChapter?'active':''}" data-id="${c.id}">${c.emoji} 第${c.id}章</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => openChapter(parseInt(b.dataset.id))));
}

/* ========== 测验渲染 ========== */
let quizState = { submitted:false, answers:{} };

function renderQuiz(ch, showResults){
  const block = document.getElementById('quiz-block');
  block.innerHTML = `<h3>✏️ 本章练习 · 共 ${ch.quiz.length} 题</h3>` + ch.quiz.map((q, i) => {
    const qid = ch.id + '_' + i;
    const saved = quizState.answers[qid];
    let body = '';
    let feedback = '';
    if(q.type==='single'){
      body = q.opts.map((opt, oi) => {
        let cls = '';
        if(showResults){
          if(oi===q.ans) cls='correct';
          else if(saved===oi) cls='wrong';
        } else if(saved===oi) cls='selected';
        return `<label class="opt ${cls}" data-qid="${qid}" data-oi="${oi}">
          <input type="radio" name="${qid}" value="${oi}" ${saved===oi?'checked':''} style="display:none">
          ${String.fromCharCode(65+oi)}. ${opt}
        </label>`;
      }).join('');
    } else if(q.type==='fill'){
      let cls = '';
      const userAns = saved || '';
      if(showResults){
        cls = (userAns.trim().toLowerCase() === q.ans.toLowerCase()) ? 'correct' : 'wrong';
      }
      body = `<input type="text" class="${cls}" placeholder="输入你的答案..." value="${userAns}" data-qid="${qid}">
        ${showResults && cls==='wrong' ? `<div class="ans-hint">正确答案：<b>${q.ans}</b></div>` : ''}`;
    } else if(q.type==='judge'){
      body = `<label class="opt ${showResults && saved===q.ans ? 'correct' : (showResults && saved!==q.ans && saved!==undefined ? 'wrong' : (saved===true?'selected':''))}" data-qid="${qid}" data-val="true">
        <input type="radio" name="${qid}" value="true" ${saved===true?'checked':''} style="display:none">
        ✅ 正确
      </label>
      <label class="opt ${showResults && saved===q.ans ? 'correct' : (showResults && saved!==q.ans && saved!==undefined ? 'wrong' : (saved===false?'selected':''))}" data-qid="${qid}" data-val="false">
        <input type="radio" name="${qid}" value="false" ${saved===false?'checked':''} style="display:none">
        ❌ 错误
      </label>`;
    }
    if(showResults && q.reason && ((q.type==='single' && saved!==q.ans) || (q.type==='judge' && saved!==q.ans) || (q.type==='fill' && (saved||'').trim().toLowerCase()!==q.ans.toLowerCase()))){
      feedback = `<div class="q-feedback no">💡 ${q.reason}</div>`;
    }
    return `<div class="q-item">
      <div class="q-text"><span class="q-num">${i+1}</span>${q.text}<span class="q-type">${q.type==='single'?'单选':q.type==='fill'?'填空':'判断'}</span></div>
      ${body}${feedback}
      ${q.hint ? `<div class="ans-hint">提示：${q.hint}</div>` : ''}
    </div>`;
  }).join('');

  // 绑定交互
  block.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', e => {
      if(quizState.submitted) return;
      const qid = el.dataset.qid;
      if(q.type==='single'){
        const oi = parseInt(el.dataset.oi);
        quizState.answers[qid] = oi;
        el.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        el.querySelector('input').checked = true;
      } else if(q.type==='judge'){
        const val = el.dataset.val === 'true';
        quizState.answers[qid] = val;
        el.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        el.querySelector('input').checked = true;
      }
    });
  });
  block.querySelectorAll('input[type=text]').forEach(inp => {
    inp.addEventListener('input', e => {
      if(quizState.submitted) return;
      quizState.answers[inp.dataset.qid] = inp.value;
    });
  });
}

/* ========== 提交判分 ========== */
function submitQuiz(){
  const ch = CHAPTERS.find(c => c.id === currentChapter);
  if(!ch) return;
  let correct = 0;
  const wrongList = [];
  ch.quiz.forEach((q, i) => {
    const qid = ch.id + '_' + i;
    const user = quizState.answers[qid];
    let ok = false;
    if(q.type==='single') ok = (user === q.ans);
    else if(q.type==='judge') ok = (user === q.ans);
    else if(q.type==='fill') ok = ((user||'').trim().toLowerCase() === q.ans.toLowerCase());
    if(ok) correct++;
    else {
      wrongList.push({ qid, text:q.text, type:q.type, myAns: user==null?'（未答）':user, rightAns:q.ans });
      Store.addWrong(qid, { chapterId: ch.id, chapterTitle: ch.title, text:q.text, myAns: user==null?'（未答）':String(user), rightAns:String(q.ans), type:q.type });
    }
  });
  quizState.submitted = true;
  renderQuiz(ch, true);

  const total = ch.quiz.length;
  const score = Math.round(correct/total * 100);
  Store.markDone(ch.id, score);
  spawnHearts();

  const r = document.getElementById('score-result');
  let msg = score>=90 ? '哇！太厉害啦 🌟' : score>=70 ? '不错哦，继续加油！💪' : score>=60 ? '及格啦！再复习一下会更好～ 📚' : '别灰心，再看一遍知识点！🌸';
  r.innerHTML = `<div class="score-box">
    <div class="big">${score}</div>
    <div class="label">本次得分（${correct}/${total}）</div>
    <div class="msg">${msg}</div>
  </div>`;
  document.getElementById('quiz-controls').style.display = 'none';
  document.getElementById('quiz-block').scrollIntoView({behavior:'smooth'});
}

function resetQuiz(){
  const ch = CHAPTERS.find(c => c.id === currentChapter);
  quizState = { submitted:false, answers:{} };
  renderQuiz(ch, false);
  document.getElementById('score-result').innerHTML = '';
  document.getElementById('quiz-controls').style.display = 'block';
}

document.addEventListener('click', e => {
  if(e.target.id === 'submit-quiz') submitQuiz();
  if(e.target.id === 'reset-quiz') resetQuiz();
  if(e.target.id === 'fav-btn'){
    const ok = Store.toggleFav(currentChapter);
    e.target.textContent = ok ? '★ 已收藏' : '⭐ 收藏';
    e.target.classList.toggle('faved', ok);
  }
});

function spawnHearts(){
  const hearts = ['💕','✨','⭐','🎉','🌸'];
  for(let i=0;i<6;i++){
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      h.style.left = (40 + Math.random()*20) + '%';
      h.style.top = '40%';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),1500);
    }, i*150);
  }
}

/* ========== 练习页面 ========== */
function renderQuizPage(){
  const nav = document.getElementById('quiz-nav');
  nav.innerHTML = CHAPTERS.map(c => `<button data-id="${c.id}" class="${c.id===currentChapter?'active':''}">${c.emoji} 第${c.id}章</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    currentChapter = parseInt(b.dataset.id);
    quizState = { submitted:false, answers:{} };
    renderQuizPage();
    const area = document.getElementById('quiz-page-area');
    const ch = CHAPTERS.find(c => c.id===currentChapter);
    area.innerHTML = `<div class="card pink"><div id="qp-quiz-block"></div><div class="quiz-controls">
      <button class="btn-primary" id="qp-submit">提交答案</button>
      <button class="btn-secondary" id="qp-reset">重做</button>
    </div><div id="qp-result"></div></div>`;
    renderQuizArea(ch);
  }));
  const area = document.getElementById('quiz-page-area');
  const ch = CHAPTERS.find(c => c.id===currentChapter);
  if(!ch) return;
  area.innerHTML = `<div class="card pink"><div id="qp-quiz-block"></div><div class="quiz-controls">
    <button class="btn-primary" id="qp-submit">提交答案</button>
    <button class="btn-secondary" id="qp-reset">重做</button>
  </div><div id="qp-result"></div></div>`;
  renderQuizArea(ch);
}

function renderQuizArea(ch){
  const block = document.getElementById('qp-quiz-block');
  block.innerHTML = `<h3 style="text-align:center;color:var(--pink-deep);font-size:19px;margin-bottom:14px">📝 ${ch.emoji} 第${ch.id}章：${ch.title}（共 ${ch.quiz.length} 题）</h3>` + ch.quiz.map((q, i) => {
    const qid = ch.id + '_' + i;
    const saved = quizState.answers[qid];
    let body = '';
    let feedback = '';
    if(q.type==='single'){
      body = q.opts.map((opt, oi) => {
        let cls = '';
        if(quizState.submitted){
          if(oi===q.ans) cls='correct';
          else if(saved===oi) cls='wrong';
        } else if(saved===oi) cls='selected';
        return `<label class="opt ${cls}" data-qid="${qid}" data-oi="${oi}">
          <input type="radio" name="${qid}" value="${oi}" ${saved===oi?'checked':''} style="display:none">
          ${String.fromCharCode(65+oi)}. ${opt}
        </label>`;
      }).join('');
    } else if(q.type==='fill'){
      let cls = '';
      const userAns = saved || '';
      if(quizState.submitted){
        cls = (userAns.trim().toLowerCase() === q.ans.toLowerCase()) ? 'correct' : 'wrong';
      }
      body = `<input type="text" class="${cls}" placeholder="输入你的答案..." value="${userAns}" data-qid="${qid}">
        ${quizState.submitted && cls==='wrong' ? `<div class="ans-hint">正确答案：<b>${q.ans}</b></div>` : ''}`;
    } else if(q.type==='judge'){
      body = `<label class="opt ${quizState.submitted && saved===q.ans ? 'correct' : (quizState.submitted && saved!==q.ans && saved!==undefined ? 'wrong' : (saved===true?'selected':''))}" data-qid="${qid}" data-val="true">
        <input type="radio" name="${qid}" value="true" ${saved===true?'checked':''} style="display:none">✅ 正确</label>
      <label class="opt ${quizState.submitted && saved===q.ans ? 'correct' : (quizState.submitted && saved!==q.ans && saved!==undefined ? 'wrong' : (saved===false?'selected':''))}" data-qid="${qid}" data-val="false">
        <input type="radio" name="${qid}" value="false" ${saved===false?'checked':''} style="display:none">❌ 错误</label>`;
    }
    if(quizState.submitted && q.reason){
      const wrong = (q.type==='single' && saved!==q.ans) || (q.type==='judge' && saved!==q.ans) || (q.type==='fill' && (saved||'').trim().toLowerCase()!==q.ans.toLowerCase());
      if(wrong) feedback = `<div class="q-feedback no">💡 ${q.reason}</div>`;
    }
    return `<div class="q-item">
      <div class="q-text"><span class="q-num">${i+1}</span>${q.text}<span class="q-type">${q.type==='single'?'单选':q.type==='fill'?'填空':'判断'}</span></div>
      ${body}${feedback}${q.hint ? `<div class="ans-hint">提示：${q.hint}</div>` : ''}
    </div>`;
  }).join('');

  block.querySelectorAll('.opt').forEach(el => el.addEventListener('click', e => {
    if(quizState.submitted) return;
    const qid = el.dataset.qid;
    if(q.type==='single'){
      const oi = parseInt(el.dataset.oi);
      quizState.answers[qid] = oi;
      el.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      el.querySelector('input').checked = true;
    } else if(q.type==='judge'){
      quizState.answers[qid] = (el.dataset.val==='true');
      el.parentElement.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      el.querySelector('input').checked = true;
    }
  }));
  block.querySelectorAll('input[type=text]').forEach(inp => inp.addEventListener('input', e => {
    if(quizState.submitted) return;
    quizState.answers[inp.dataset.qid] = inp.value;
  }));
}

document.addEventListener('click', e => {
  if(e.target.id === 'qp-submit'){
    const ch = CHAPTERS.find(c => c.id===currentChapter);
    let correct = 0;
    ch.quiz.forEach((q,i) => {
      const qid = ch.id+'_'+i;
      const u = quizState.answers[qid];
      let ok=false;
      if(q.type==='single') ok=(u===q.ans);
      else if(q.type==='judge') ok=(u===q.ans);
      else if(q.type==='fill') ok=((u||'').trim().toLowerCase()===q.ans.toLowerCase());
      if(ok) correct++;
      else {
        Store.addWrong(qid, { chapterId:ch.id, chapterTitle:ch.title, text:q.text, myAns:u==null?'（未答）':String(u), rightAns:String(q.ans), type:q.type });
      }
    });
    quizState.submitted = true;
    renderQuizArea(ch);
    const total = ch.quiz.length;
    const score = Math.round(correct/total*100);
    Store.markDone(ch.id, score);
    spawnHearts();
    document.getElementById('qp-result').innerHTML = `<div class="score-box"><div class="big">${score}</div><div class="label">本次得分（${correct}/${total}）</div></div>`;
    document.getElementById('qp-submit').style.display='none';
  }
  if(e.target.id === 'qp-reset'){
    quizState = { submitted:false, answers:{} };
    const ch = CHAPTERS.find(c => c.id===currentChapter);
    renderQuizArea(ch);
    document.getElementById('qp-result').innerHTML = '';
    document.getElementById('qp-submit').style.display='inline-block';
  }
});

/* ========== 个人中心 ========== */
function renderCenter(tab){
  document.querySelectorAll('.center-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  ['progress','wrong','fav'].forEach(t => document.getElementById('tab-'+t).style.display = (t===tab?'block':'none'));
  if(tab==='progress'){
    const doneList = CHAPTERS.map(c => ({...c, done: Store.isDone(c.id), score: Store.progress[c.id]?.score || 0})).reverse();
    const doneCount = doneList.filter(c => c.done).length;
    document.getElementById('tab-progress').innerHTML = `
      <h3>📈 学习进度</h3>
      <p style="margin:8px 0">共 ${CHAPTERS.length} 章，已学 <b style="color:var(--pink-deep)">${doneCount}</b> 章</p>
      ${doneList.map(c => `<div class="chapter-item ${c.done?'done':''}" data-id="${c.id}" style="cursor:pointer;margin:8px 0">
        <div class="num">${c.emoji}</div>
        <div class="info">
          <div class="title">第 ${c.id} 章 ${c.title}</div>
          <div class="desc">${c.done?`最近得分：${c.score} 分`:'未学习'}</div>
          <div class="progress-bar"><div style="width:${c.done?'100%':'0%'}"></div></div>
        </div>
        <div class="badge">${c.done?'✅ 已学':'📖 去学'}</div>
      </div>`).join('')}
    `;
    document.querySelectorAll('#tab-progress .chapter-item').forEach(el => el.addEventListener('click', () => openChapter(parseInt(el.dataset.id))));
  } else if(tab==='wrong'){
    const w = Store.wrongs;
    const byChapter = {};
    w.forEach(x => { byChapter[x.chapterId] = byChapter[x.chapterId] || []; byChapter[x.chapterId].push(x); });
    let html = '<h3>❌ 错题本</h3>';
    if(w.length === 0) html += '<div class="empty"><span class="emoji">🎉</span>太棒了，还没有错题！</div>';
    else {
      Object.entries(byChapter).forEach(([cid, items]) => {
        const ch = CHAPTERS.find(c => c.id===parseInt(cid));
        html += `<h4 style="margin-top:16px">${ch?.emoji} 第${cid}章 · ${ch?.title}（${items.length}题）</h4>`;
        html += items.map(it => `
          <div class="wrong-item">
            <button class="del" data-qid="${it.qid}">删除</button>
            <div class="q">${it.text}</div>
            <div class="meta">题型：${it.type==='single'?'单选':it.type==='fill'?'填空':'判断'} · 你的答案：<span style="color:#d45a5a">${it.myAns}</span></div>
            <div class="ans">✅ 正确答案：<b>${it.rightAns}</b></div>
          </div>
        `).join('');
      });
    }
    document.getElementById('tab-wrong').innerHTML = html;
    document.querySelectorAll('#tab-wrong .del').forEach(b => b.addEventListener('click', () => {
      Store.removeWrong(b.dataset.qid);
      renderCenter('wrong');
    }));
  } else if(tab==='fav'){
    const favs = Store.favorites;
    let html = '<h3>⭐ 收藏夹</h3>';
    if(favs.length === 0) html += '<div class="empty"><span class="emoji">💭</span>还没有收藏内容哦～</div>';
    else {
      html += favs.map(id => {
        const ch = CHAPTERS.find(c => c.id===id);
        return `<div class="fav-item" data-id="${id}" style="cursor:pointer">
          <button class="del" data-id="${id}">取消</button>
          <div class="title">${ch?.emoji} 第${id}章 · ${ch?.title}</div>
          <div class="meta">${ch?.short}</div>
        </div>`;
      }).join('');
    }
    document.getElementById('tab-fav').innerHTML = html;
    document.querySelectorAll('#tab-fav .fav-item').forEach(el => el.addEventListener('click', e => {
      if(e.target.classList.contains('del')){
        Store.toggleFav(parseInt(e.target.dataset.id));
        renderCenter('fav');
      } else openChapter(parseInt(el.dataset.id));
    }));
  }
}

document.querySelectorAll('.center-tabs button').forEach(b => b.addEventListener('click', () => renderCenter(b.dataset.tab)));

/* ========== 重置 ========== */
document.addEventListener('click', e => {
  if(e.target.id === 'reset-all'){
    if(confirm('确定重置所有学习记录吗？此操作不可撤销哦～')){
      localStorage.clear();
      renderHome();
      renderCenter('progress');
      alert('已重置，祝你重新出发！🌈');
    }
  }
});

/* ========== 练习页面 tab 切换 ========== */
document.querySelector('[data-nav="quiz"]').addEventListener('click', () => {
  currentChapter = currentChapter || 1;
  quizState = { submitted:false, answers:{} };
  renderQuizPage();
});

/* ========== 初始化 ========== */
renderHome();
</script>
